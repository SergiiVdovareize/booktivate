name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy to GitHub Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install & Build
        run: |
          npm ci --legacy-peer-deps
          npm run test:coverage
          npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Run Post-Deployment Lighthouse Audit & Update README
        run: |
          npx lhci autorun
          node -e '
            const links = require("./.lighthouseci/links.json");
            const reportUrl = Object.values(links)[0];
            if (reportUrl) {
              const fs = require("fs");
              let readme = fs.readFileSync("README.md", "utf8");
              readme = readme.replace(/\* \*\*Lighthouse Audit Report\*\*: .*/, `* **Lighthouse Audit Report**: [${reportUrl}](${reportUrl})`);
              readme = readme.replace(/\[!\[Lighthouse CI\]\(.*?\)]\(.*?\)/, `[![Lighthouse CI](https://img.shields.io/badge/Lighthouse_CI-passing-blue?logo=lighthouse)](${reportUrl})`);
              fs.writeFileSync("README.md", readme);
            }
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update post-deployment Lighthouse audit report link and badge [skip ci]" || true
          git push
