name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy to GitHub Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install, Build & Audit Production
        run: |
          npm ci --legacy-peer-deps
          npm run test:coverage
          npm run build
          npx lhci autorun || true
          node -e '
            const fs = require("fs");
            let reportUrl = "";
            try {
              const links = require("./.lighthouseci/links.json");
              reportUrl = Object.values(links)[0] || "";
            } catch (e) {}
            if (reportUrl) {
              fs.mkdirSync("build/lighthouse", { recursive: true });
              const html = `<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=${reportUrl}"><script>window.location.replace("${reportUrl}");</script></head><body>Redirecting to <a href="${reportUrl}">Lighthouse Audit Report</a>...</body></html>`;
              fs.writeFileSync("build/lighthouse/index.html", html);
            }
          '

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
